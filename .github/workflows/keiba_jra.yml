name: keiba-jra

on:
  schedule:
    - cron: '0 22 * * *'       # 日本時間 7:00 前の日までの答え合わせ → 今日の出馬表と材料
    - cron: '*/15 0-7 * * *'   # 日本時間 9:00〜16:45 の15分ごと：発走の2〜25分前のレースを予想して記録
    - cron: '30 8 * * *'       # 日本時間 17:30 今日の答え合わせ
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keiba-jra
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: どの仕事か決める
        id: m
        run: |
          S="${{ github.event.schedule }}"
          if [ -z "$S" ] || [ "$S" = "0 22 * * *" ]; then M=prepare; elif [ "$S" = "30 8 * * *" ]; then M=settle; else M=predict; fi
          D=$(TZ=Asia/Tokyo date +%Y%m%d)
          if [ "$M" = predict ] && [ ! -f "data/keiba_history/s5_tool/day_$D.pkl" ]; then echo "go=0" >> $GITHUB_OUTPUT; echo "今日は開催がないか、朝の準備がまだです"; else echo "go=1" >> $GITHUB_OUTPUT; fi
          echo "mode=$M" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        if: steps.m.outputs.go == '1'
        with:
          python-version: '3.11'
      - if: steps.m.outputs.go == '1'
        run: pip install pandas numpy scipy lightgbm requests beautifulsoup4 gdown
      - name: ドライブからコードとデータを取ってくる
        if: steps.m.outputs.go == '1'
        run: |
          python -c "import gdown; gdown.download_folder(id='1yb9be0kpev2fAHBjeKY4QMEDu2NAwpXW', output='drive_jra', quiet=True)"
          cp drive_jra/keiba_auto.py .
      - name: 実行
        if: steps.m.outputs.go == '1'
        env:
          KEIBA_BASE: data
          DRIVE_DIR: drive_jra
          REPORT_MD: report_jra.md
          TZ: Asia/Tokyo
        run: python keiba_auto.py ${{ steps.m.outputs.mode }}
      - name: 記録を保存
        if: steps.m.outputs.go == '1'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mkdir -p data/new data/state
          git add -A data/new data/state data/keiba_history/s5_tool report_jra.md || true
          git diff --cached --quiet && exit 0
          git commit -m "競馬（中央） ${{ steps.m.outputs.mode }} $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
